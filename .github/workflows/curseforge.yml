name: Build addon and optionally publish to CurseForge

on:
  push:
    tags: ['v[0-9]*', '[0-9]*']
  pull_request:
    paths:
      - '.github/workflows/curseforge.yml'
      - 'tools/curseforge_release.py'
      - 'tests/test_curseforge_release.py'
      - 'tests/test_curseforge_workflow_policy.py'
      - 'docs/CURSEFORGE-RELEASES.md'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build (for publishing, select this exact existing tag under Use workflow from)
        required: true
        type: string
      publish:
        description: Publish this existing release tag to CurseForge after all checks pass
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: curseforge-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate explicit publication target
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, subprocess, sys
          sys.path.insert(0, 'tools')
          from curseforge_release import release_version
          tag = os.environ['REQUESTED_VERSION']
          release_version(tag)
          ref = 'refs/tags/' + tag
          if os.environ['GITHUB_REF'] != ref:
              raise SystemExit('To publish, select the same existing release tag under Use workflow from and Version.')
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tagged = subprocess.check_output(['git', 'rev-parse', '--verify', ref + '^{commit}'], text=True).strip()
          if head != tagged:
              raise SystemExit('The checkout does not match the selected release tag.')
          subprocess.run(['git', 'merge-base', '--is-ancestor', head, 'origin/main'], check=True)
          PY
      - name: Test release metadata and upload handling
        run: |
          python3 tests/test_curseforge_release.py -v
          python3 tests/test_curseforge_workflow_policy.py -v
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Review studies and compile the build database
        run: |
          # Reproduce the research snapshot reviewed with this release commit.
          # Publishing must not replace it with a moving branch's latest data.
          python3 tools/prepare_build_research.py
      - name: Run all addon validation
        run: bash tests/run.sh
      - name: Prepare version and CurseForge metadata
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version || 'v0.0.0-alpha.1' }}
        run: python3 tools/curseforge_release.py prepare
      - name: Package and verify
        run: |
          python3 tools/package_addon.py dist/LootLiquidator.zip
          python3 tools/verify_distribution.py dist/LootLiquidator.zip
          cp database/research/build-research-manifest.json dist/
          cp database/research/build-study-review.json dist/
          cp database/research/v3-snapshot/SNAPSHOT.json dist/research-snapshot.json
          sha256sum dist/LootLiquidator.zip > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: LootLiquidator-curseforge
          path: dist/
          if-no-files-found: error
      - name: Upload verified version tag to CurseForge
        # Builds and tag pushes never publish. Publishing is a separate, explicit manual choice.
        if: github.event_name == 'workflow_dispatch' && inputs.publish == true && startsWith(github.ref, 'refs/tags/') && inputs.version == github.ref_name
        env:
          CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
        run: python3 tools/curseforge_release.py upload
