name: Verify database and addon
on:
  push:
    branches: [implementation/database-profession-modernization]
  pull_request:
    paths:
      - 'LootLiquidator/**'
      - 'database/**'
      - 'tools/**'
      - 'tests/**'
      - 'research/tests/test_verified_mechanics_adapter.lua'
      - '.github/workflows/**'
jobs:
  lua51:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Compile, validate package and run fixtures
        run: bash tests/run.sh
