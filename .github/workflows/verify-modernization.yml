name: Validate consolidated addon
on:
  push:
    branches: [main, integration/current-addon]
  pull_request:
    branches: [main, integration/current-addon]
permissions:
  contents: read
jobs:
  lua51:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Validate generated databases, package and regression fixtures
        run: bash tests/run.sh
      - name: Stamp build and PR information
        run: python3 tools/stamp_build_info.py
      - name: Build isolated test addon ZIP
        run: python3 tools/package_addon.py dist/LootLiquidator-test.zip
      - uses: actions/upload-artifact@v4
        with:
          name: LootLiquidator-test
          path: dist/LootLiquidator-test.zip
  lupa-shim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install embedded and native Lua 5.1
        run: |
          python3 -m pip install 'lupa==2.8'
          sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Test checked-in wrapper subprocess contracts
        env:
          NATIVE_LUA51: /usr/bin/lua5.1
        run: python3 tests/test_lua51_shim.py -v
      - name: Run full suite with checked-in embedded Lua wrappers
        run: PATH="$PWD/tools/lua51-shim:$PATH" bash tests/run.sh
