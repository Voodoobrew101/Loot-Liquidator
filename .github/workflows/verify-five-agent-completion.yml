name: Verify five-agent completion
on:
  pull_request:
  push:
    branches: [implementation/five-agent-completion]
jobs:
  research-candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'jsonschema==4.26.0'
      - name: Install Lua 5.1 for compiler roundtrip checks
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y lua5.1
      - run: node research/tools/run_completion_pipeline.js --check
      - name: Verify Lua 5.1 syntax and decoded working/evidence isolation
        run: |
          luac5.1 -p research/proposed/itemdb.lua
          lua5.1 research/tests/test_generated_working_estimates.lua
      - name: Verify blocker arrays survive Lua roundtrip
        run: |
          lua5.1 - <<'LUA'
          local db = dofile("research/proposed/itemdb.lua")
          local fields = {"dropChance", "yieldMin", "yieldMax", "expectedQuantity"}
          local multi, extra = 0, 0
          for _, record in ipairs(db.processing) do
            for _, name in ipairs(fields) do
              local blockers = record[name].blockers
              for _, blocker in ipairs(blockers) do
                assert(not string.find(blocker, "|", 1, true), "Joined blockers: " .. record.recordID .. ":" .. name)
              end
              if #blockers > 1 then
                multi = multi + 1
                extra = extra + #blockers - 1
              end
            end
          end
          assert(multi > 0 and extra > 0, "Multi-blocker evidence collapsed in candidate")
          print("PASS: " .. multi .. " multi-blocker fields and " .. extra .. " additional blockers preserved")
          LUA

  f002-one-time-rebuild:
    if: "${{ github.event_name == 'push' && github.event.head_commit.message == 'chore(F002): one-time regenerate cast-basis candidate' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Regenerate only research candidate outputs
        run: |
          node -e 'require("./research/tools/run_completion_pipeline.js").run(process.cwd(),{test:false})'
          git add research/proposed/itemdb.lua research/proposed/itemdb-build-report.json research/ledger/itemdb-missing-fields.csv research/ledger/itemdb-source-alternates.csv research/coordination/completion-readiness.json research/coordination/completion-priorities.json
          if git diff --cached --quiet; then echo "No generated changes"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build(F002): regenerate cast-basis-safe research preview'
          git push origin HEAD:implementation/five-agent-completion
