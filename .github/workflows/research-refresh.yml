name: Review research build artifacts
# Keep the existing schedule. Research remains on its durable source branch;
# generated database changes are validated and packaged in this build workspace.
# No routine PR, main commit, version bump, issue or release is created.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-refresh
  cancel-in-progress: false

env:
  RESEARCH_BRANCH: implementation/five-agent-completion
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve durable research source once
        id: source
        run: |
          git fetch --no-tags origin "$RESEARCH_BRANCH"
          echo "commit=$(git rev-parse FETCH_HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Review studies and compile database
        env:
          RESEARCH_COMMIT: ${{ steps.source.outputs.commit }}
        run: python3 tools/prepare_build_research.py --research-ref "$RESEARCH_COMMIT"
      - name: Run all addon tests
        run: bash tests/run.sh
      - name: Package validated research build
        run: |
          python3 tools/package_addon.py dist/LootLiquidator.zip
          python3 tools/verify_distribution.py dist/LootLiquidator.zip
          cp database/research/build-research-manifest.json dist/
          cp database/research/build-study-review.json dist/
          cp database/research/v3-snapshot/SNAPSHOT.json dist/research-snapshot.json
          sha256sum dist/LootLiquidator.zip > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: validated-research-build
          path: dist/
          if-no-files-found: error
