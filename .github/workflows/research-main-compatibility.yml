name: Research compatibility with main
on:
  pull_request:
    paths:
      - 'research/**'
      - '.github/workflows/research-main-compatibility.yml'
permissions:
  contents: read
jobs:
  compatible-addon:
    runs-on: ubuntu-latest
    env:
      RESEARCH_CANDIDATE: ${{ github.base_ref == 'implementation/five-agent-completion' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select the prospective addon and research inputs
        run: |
          git fetch --no-tags origin main
          if [ "$RESEARCH_CANDIDATE" = 'true' ]; then
            # Checkout initially contains GitHub's prospective research merge.
            # Consume its immutable data/tool snapshot with current addon code;
            # merging unrelated historical addon/workflow files is not a build.
            candidate_commit=$(git rev-parse HEAD)
            git checkout --detach origin/main
            echo "RESEARCH_COMMIT=$candidate_commit" >> "$GITHUB_ENV"
          else
            git -c user.name='Compatibility check' -c user.email='compatibility@localhost' merge --no-commit --no-ff origin/main
          fi
      - name: Install native Lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - name: Review and compile the candidate research snapshot
        if: env.RESEARCH_CANDIDATE == 'true'
        run: python3 tools/prepare_build_research.py --research-ref "$RESEARCH_COMMIT"
      - name: Validate addon behavior and pinned generated data
        run: bash tests/run.sh
