name: Community release bridge tests
on:
  push:
    branches: [main]
    paths: ['tools/community_release_bridge.py', 'tests/test_community_release_bridge.py', '.github/workflows/community-release-*.yml']
  pull_request:
    paths: ['tools/community_release_bridge.py', 'tests/test_community_release_bridge.py', '.github/workflows/community-release-*.yml']
permissions:
  contents: read
jobs:
  bridge-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python3 tests/test_community_release_bridge.py -v
